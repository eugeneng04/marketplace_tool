services:
  postgres:
    image: postgres:16-alpine
    container_name: resale-intelligence-postgres
    environment:
      POSTGRES_DB: resale_intelligence
      POSTGRES_USER: resale
      POSTGRES_PASSWORD: resale
    ports:
      - "54329:5432"
    volumes:
      - resale_intelligence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resale -d resale_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  resale_intelligence_pgdata:
