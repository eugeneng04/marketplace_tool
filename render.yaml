services:
  - type: web
    name: resale-intelligence
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SCHEDULER_TOKEN
        generateValue: true
      - key: API_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CONNECTOR_MODE
        value: facebook_graphql
      - key: FB_MAX_REQUESTS_PER_MINUTE
        value: "3"
      - key: MAX_CARDS_PER_RUN
        value: "25"
