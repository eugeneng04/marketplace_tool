services:
  - type: web
    name: resale-intelligence-api
    runtime: node
    plan: free
    rootDir: apps/worker
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONNECTOR_MODE
        value: mock
      - key: DEFAULT_REGION
        value: us-ca
      - key: PREFER_MANUAL_TRANSMISSION
        value: "true"
      - key: API_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: resale-intelligence-db
          property: connectionString

databases:
  - name: resale-intelligence-db
    plan: free
    postgresMajorVersion: 16
